name: One-off tennis discovery patch

on:
  push:
    branches:
      - fix/tennis-all-sports-fallback-20260927
    paths:
      - ".github/patch_tennis_all_sports.py"
      - ".github/workflows/one-off-tennis-discovery.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tennis-all-sports-fallback-20260927
      - name: Apply targeted patch
        run: python .github/patch_tennis_all_sports.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tennis-quant/lib/oddspapi.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: recover supported tennis sports from full catalog"
          git push origin HEAD:fix/tennis-all-sports-fallback-20260927
