name: EdgeScope Pages

on:
  push:
    branches:
      - edgescope-mvp
    paths:
      - "edgescope-static/**"
      - ".github/workflows/edgescope-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: edgescope-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload EdgeScope
        uses: actions/upload-pages-artifact@v4
        with:
          path: edgescope-static
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
