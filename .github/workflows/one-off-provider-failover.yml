name: One-off provider failover patch

on:
  push:
    branches:
      - fix/provider-failover-and-sync-20260925
    paths:
      - ".github/patch_provider_failover.py"
      - ".github/workflows/one-off-provider-failover.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/provider-failover-and-sync-20260925

      - name: Apply targeted patch
        run: python .github/patch_provider_failover.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tennis-quant/lib/oddspapi.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: fail over when OddsPapi quota is exhausted"
          git push origin HEAD:fix/provider-failover-and-sync-20260925
