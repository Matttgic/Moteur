name: EdgeScope CI

on:
  pull_request:
    paths:
      - "edgescope/**"
      - ".github/workflows/edgescope-ci.yml"
  push:
    branches:
      - edgescope-mvp
    paths:
      - "edgescope/**"
      - ".github/workflows/edgescope-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edgescope
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: edgescope/package.json
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
