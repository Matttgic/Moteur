name: Tennis Quant CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - tennis-quant-v1
    paths:
      - "tennis-quant/**"
      - ".github/workflows/tennis-quant-ci.yml"
  pull_request:
    paths:
      - "tennis-quant/**"
      - ".github/workflows/tennis-quant-ci.yml"

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tennis-quant

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  ml:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tennis-quant/ml
    env:
      PYTHONPATH: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ML dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        run: pytest -q

      - name: ATP multi-year benchmark
        run: |
          python -m tennis_quant_ml.train \
            --tour ATP \
            --start-year 2005 \
            --end-year 2026 \
            --test-years 2022 2023 2024 2025 \
            --output /tmp/tennis-quant-atp

      - name: WTA multi-year benchmark
        run: |
          python -m tennis_quant_ml.train \
            --tour WTA \
            --start-year 2005 \
            --end-year 2026 \
            --test-years 2022 2023 2024 2025 \
            --output /tmp/tennis-quant-wta

      - name: Upload ATP inference artifact
        uses: actions/upload-artifact@v4
        with:
          name: tennis-quant-atp-inference
          path: |
            /tmp/tennis-quant-atp/inference_spec.json
            /tmp/tennis-quant-atp/rank_only_fallback/inference_spec.json
            /tmp/tennis-quant-atp/report.json
            /tmp/tennis-quant-atp/player_state_seed.json
          retention-days: 7

      - name: Upload WTA inference artifact
        uses: actions/upload-artifact@v4
        with:
          name: tennis-quant-wta-inference
          path: |
            /tmp/tennis-quant-wta/inference_spec.json
            /tmp/tennis-quant-wta/rank_only_fallback/inference_spec.json
            /tmp/tennis-quant-wta/report.json
            /tmp/tennis-quant-wta/player_state_seed.json
          retention-days: 7

      - name: Commit generated player state seeds
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          target = Path("../generated")
          target.mkdir(parents=True, exist_ok=True)

          for tour in ("atp", "wta"):
              source = Path(f"/tmp/tennis-quant-{tour}/player_state_seed.json")
              payload = json.loads(source.read_text(encoding="utf-8"))
              destination = target / f"{tour}-player-state-seed.json"
              destination.write_text(
                  json.dumps(payload, separators=(",", ":"), ensure_ascii=False),
                  encoding="utf-8",
              )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ../generated/atp-player-state-seed.json ../generated/wta-player-state-seed.json

          if git diff --cached --quiet; then
            echo "Generated state seeds unchanged."
            exit 0
          fi

          git commit -m "ml: refresh generated player state seeds [skip ci]"
          git fetch origin "${{ github.head_ref }}"
          git rebase "origin/${{ github.head_ref }}"
          git push origin HEAD:${{ github.head_ref }}
