name: One-off compact economic history

on:
  push:
    branches:
      - fix/compact-economic-history-20260928
    paths:
      - ".github/patch_compact_history.py"
      - ".github/workflows/one-off-compact-history.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/compact-economic-history-20260928
      - name: Apply targeted patch
        run: python .github/patch_compact_history.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tennis-quant/app/economic-validation.tsx tennis-quant/app/globals.css
          git diff --cached --quiet && exit 0
          git commit -m "fix: compact economic pick history"
          git push origin HEAD:fix/compact-economic-history-20260928
