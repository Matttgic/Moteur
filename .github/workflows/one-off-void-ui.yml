name: One-off VOID UI patch

on:
  push:
    branches:
      - fix/provider-failover-and-sync-20260925
    paths:
      - ".github/patch_void_ui.py"
      - ".github/workflows/one-off-void-ui.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/provider-failover-and-sync-20260925
      - name: Apply targeted UI patch
        run: python .github/patch_void_ui.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tennis-quant/app/economic-validation.tsx tennis-quant/app/quality-economics.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: display VOID bets as settled cancellations"
          git push origin HEAD:fix/provider-failover-and-sync-20260925
